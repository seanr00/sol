<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Binary Message Signer</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        .wallet-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .wallet-status {
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }

        .wallet-status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .wallet-address {
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-top: 8px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 15px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message-section {
            display: none;
            margin-top: 30px;
        }

        .message-section.visible {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.visible {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            color: white;
            position: relative;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: white;
        }

        .modal-subtitle {
            font-size: 14px;
            color: #999;
        }

        .binary-message {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            line-height: 1.6;
            word-wrap: break-word;
            word-break: break-all;
            font-size: 16px;
            color: white;
        }

        .binary-message::-webkit-scrollbar {
            width: 8px;
        }

        .binary-message::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 4px;
        }

        .binary-message::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-actions button {
            flex: 1;
            margin: 0;
        }

        .deny-btn {
            background: #333;
        }

        .deny-btn:hover:not(:disabled) {
            background: #444;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .approve-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .info-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            line-height: 1.6;
        }

        .signature-result {
            background: #e8f5e9;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #2e7d32;
            display: none;
        }

        .signature-result.visible {
            display: block;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Solana Binary Message Signer</h1>
        
        <div class="wallet-section">
            <div id="walletStatus" class="wallet-status">
                Wallet not connected
            </div>
            <button id="connectBtn" onclick="connectWallet()">
                Connect Wallet
            </button>
        </div>

        <div id="messageSection" class="message-section">
            <button id="signBtn" onclick="requestSignature()">
                Sign Binary Message
            </button>
            <div class="info-text">
                Click to sign a 256-bit binary message with your wallet
            </div>
        </div>

        <div id="signatureResult" class="signature-result"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Approve Solana Message</div>
                <div class="modal-subtitle" id="walletInfo"></div>
            </div>
            
            <div style="margin-bottom: 15px; color: #ccc; font-size: 14px;">
                Message:
            </div>
            
            <div id="binaryMessage" class="binary-message"></div>
            
            <div class="modal-actions">
                <button class="deny-btn" onclick="denySignature()">Deny</button>
                <button class="approve-btn" onclick="approveSignature()">Approve</button>
            </div>
        </div>
    </div>

    <script>
        let walletConnected = false;
        let provider = null;
        let currentMessage = null;

        // Check if Phantom wallet is installed
        function getProvider() {
            if ('phantom' in window) {
                const provider = window.phantom?.solana;
                if (provider?.isPhantom) {
                    return provider;
                }
            }
            // Check for Solflare
            if ('solflare' in window) {
                return window.solflare;
            }
            // Check for any Solana wallet
            if ('solana' in window) {
                return window.solana;
            }
            return null;
        }

        async function connectWallet() {
            try {
                provider = getProvider();
                
                if (!provider) {
                    alert('Please install a Solana wallet (Phantom, Solflare, etc.)');
                    return;
                }

                const resp = await provider.connect();
                walletConnected = true;
                
                const walletStatus = document.getElementById('walletStatus');
                walletStatus.className = 'wallet-status connected';
                walletStatus.innerHTML = `
                    ✓ Wallet Connected
                    <div class="wallet-address">${resp.publicKey.toString()}</div>
                `;
                
                document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
                document.getElementById('connectBtn').onclick = disconnectWallet;
                document.getElementById('messageSection').classList.add('visible');
                
                console.log('Connected to wallet:', resp.publicKey.toString());
            } catch (err) {
                console.error('Error connecting wallet:', err);
                alert('Failed to connect wallet: ' + err.message);
            }
        }

        async function disconnectWallet() {
            try {
                if (provider) {
                    await provider.disconnect();
                }
                walletConnected = false;
                
                const walletStatus = document.getElementById('walletStatus');
                walletStatus.className = 'wallet-status';
                walletStatus.textContent = 'Wallet not connected';
                
                document.getElementById('connectBtn').textContent = 'Connect Wallet';
                document.getElementById('connectBtn').onclick = connectWallet;
                document.getElementById('messageSection').classList.remove('visible');
                document.getElementById('signatureResult').classList.remove('visible');
            } catch (err) {
                console.error('Error disconnecting wallet:', err);
            }
        }

        function generateRandomBinary() {
            // Generate 256 bits (32 bytes) of random data
            const bytes = new Uint8Array(32);
            crypto.getRandomValues(bytes);
            
            // Convert to binary string
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += bytes[i].toString(2).padStart(8, '0');
            }
            
            return { binary, bytes };
        }

        function displayBinaryMessage(bytes) {
            const messageDiv = document.getElementById('binaryMessage');
            
            // Try to decode the raw bytes as UTF-8, which will produce garbled text
            // This is what happens when a wallet tries to display binary data as text
            const decoder = new TextDecoder('utf-8', { fatal: false });
            const garbledText = decoder.decode(bytes);
            
            messageDiv.textContent = garbledText;
        }

        function requestSignature() {
            if (!walletConnected || !provider) {
                alert('Please connect your wallet first');
                return;
            }

            // Generate random 256-bit message (32 bytes)
            const { bytes } = generateRandomBinary();
            currentMessage = bytes;
            
            // Display the actual binary data
            displayBinaryMessage(bytes);
            
            // Show wallet info
            document.getElementById('walletInfo').textContent = provider.publicKey.toString();
            
            // Show modal
            document.getElementById('modal').classList.add('visible');
        }

        function denySignature() {
            document.getElementById('modal').classList.remove('visible');
            currentMessage = null;
            
            const resultDiv = document.getElementById('signatureResult');
            resultDiv.className = 'signature-result visible error';
            resultDiv.textContent = '❌ Signature request denied';
            
            setTimeout(() => {
                resultDiv.classList.remove('visible');
            }, 3000);
        }

        async function approveSignature() {
            if (!currentMessage) return;
            
            try {
                // Sign the raw binary message (the actual Uint8Array bytes)
                const signedMessage = await provider.signMessage(currentMessage, 'utf8');
                
                // Close modal
                document.getElementById('modal').classList.remove('visible');
                
                // Convert message bytes to hex for display
                const messageHex = Array.from(currentMessage)
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
                
                // Display signature
                const resultDiv = document.getElementById('signatureResult');
                resultDiv.className = 'signature-result visible';
                resultDiv.innerHTML = `
                    <strong>✓ Message Signed Successfully</strong><br><br>
                    <strong>Message (hex):</strong><br>
                    ${messageHex}<br><br>
                    <strong>Signature (base64):</strong><br>
                    ${btoa(String.fromCharCode(...signedMessage.signature))}<br><br>
                    <strong>Public Key:</strong><br>
                    ${signedMessage.publicKey.toString()}
                `;
                
                console.log('Message bytes:', currentMessage);
                console.log('Message hex:', messageHex);
                console.log('Signature:', signedMessage);
                
            } catch (err) {
                console.error('Error signing message:', err);
                document.getElementById('modal').classList.remove('visible');
                
                const resultDiv = document.getElementById('signatureResult');
                resultDiv.className = 'signature-result visible error';
                resultDiv.textContent = '❌ Error signing message: ' + err.message;
            }
            
            currentMessage = null;
        }

        // Auto-connect if wallet was previously connected
        window.addEventListener('load', async () => {
            provider = getProvider();
            if (provider) {
                try {
                    const resp = await provider.connect({ onlyIfTrusted: true });
                    walletConnected = true;
                    
                    const walletStatus = document.getElementById('walletStatus');
                    walletStatus.className = 'wallet-status connected';
                    walletStatus.innerHTML = `
                        ✓ Wallet Connected
                        <div class="wallet-address">${resp.publicKey.toString()}</div>
                    `;
                    
                    document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
                    document.getElementById('connectBtn').onclick = disconnectWallet;
                    document.getElementById('messageSection').classList.add('visible');
                } catch (err) {
                    // Silent fail - user just needs to connect manually
                }
            }
        });
    </script>
</body>
</html>
