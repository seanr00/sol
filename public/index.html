<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Max-Size Transaction Signer</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 { color: #333; margin-bottom: 8px; text-align: center; font-size: 22px; }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .wallet-status {
            padding: 14px 18px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            color: #777;
            text-align: center;
        }

        .wallet-status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .wallet-address {
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            margin-top: 6px;
            color: #388e3c;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 14px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .message-section { display: none; margin-top: 4px; }
        .message-section.visible { display: block; }

        .size-meter {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #555;
            text-align: center;
        }

        .size-meter .num {
            font-size: 26px;
            font-weight: 800;
            color: #667eea;
            display: block;
            line-height: 1.2;
        }

        .size-meter .num.exact {
            color: #2e7d32;
        }

        .info-text {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 6px;
            line-height: 1.6;
        }

        .result {
            background: #e8f5e9;
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 18px;
            word-break: break-all;
            font-family: monospace;
            font-size: 11px;
            color: #2e7d32;
            display: none;
        }

        .result.visible { display: block; }
        .result.error { background: #ffebee; color: #c62828; }

        .result strong { display: block; margin-bottom: 6px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h1>⛓ Solana Max-Size TX Signer</h1>
    <p class="subtitle">Builds a transaction padded to <span class="badge">exactly 1232 bytes</span></p>

    <div id="walletStatus" class="wallet-status">Wallet not connected</div>
    <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>

    <div id="messageSection" class="message-section">
        <div class="size-meter">
            <span id="sizeNum" class="num">—</span>
            bytes serialized transaction size
        </div>
        <button id="signBtn" onclick="buildAndSign()">Build &amp; Sign Max-Size Transaction</button>
        <div class="info-text">
            Constructs a real Solana transaction stuffed with instruction data<br>
            to hit the hard 1232-byte limit exactly, then asks your wallet to sign it.
        </div>
    </div>

    <div id="result" class="result"></div>
</div>



<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const MEMO_PROGRAM_ID = new solanaWeb3.PublicKey('MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr');
const MAX_TX_SIZE     = 1232;

// ─── Fake "recent blockhash" bytes we use when building the offline TX ─────────
// (We never actually submit, so any 32 bytes work for size calculation)
const DUMMY_BLOCKHASH_BYTES = new Uint8Array(32).fill(0xba);

// ─── Compact-u16 encoder (Solana wire format) ─────────────────────────────────
function compactU16(n) {
    if (n <= 0x7f) return [n];
    if (n <= 0x3fff) return [(n & 0x7f) | 0x80, n >> 7];
    return [(n & 0x7f) | 0x80, ((n >> 7) & 0x7f) | 0x80, n >> 14];
}

// ─── Calculate serialized transaction size ────────────────────────────────────
//
//  Wire layout (legacy transaction):
//  ┌──────────────────────────────────────────────┐
//  │ compact-u16  num_signatures  (1 byte, = 1)   │
//  │ [64 bytes]   signature × 1                   │
//  │ u8[3]        message header                  │
//  │ compact-u16  num_accounts    (1 byte, = 2)   │
//  │ [32 bytes]   fee payer pubkey                 │
//  │ [32 bytes]   memo program pubkey              │
//  │ [32 bytes]   recent_blockhash                 │
//  │ compact-u16  num_instructions (1 byte, = 1)  │
//  │ u8           program_id_index (= 1)           │
//  │ compact-u16  num_accounts in ix (1 byte, = 0)│
//  │ compact-u16  data_length    (1 or 2 bytes)    │
//  │ [data_length bytes] instruction data          │
//  └──────────────────────────────────────────────┘
//
//  Fixed overhead = 1+64+3+1+32+32+32+1+1+1 = 168 bytes
//  data_length compact-u16 = 2 bytes when length > 127
//  Total overhead with 2-byte compact = 170 bytes
//  Padding needed = 1232 - 170 = 1062 bytes

function calcTxSize(dataLen) {
    const dataLenBytes = compactU16(dataLen).length;
    return 1      // compact-u16: 1 sig
         + 64     // signature
         + 3      // header
         + 1      // compact-u16: 2 accounts
         + 32     // fee payer
         + 32     // memo program
         + 32     // blockhash
         + 1      // compact-u16: 1 instruction
         + 1      // program_id_index
         + 1      // compact-u16: 0 accounts
         + dataLenBytes
         + dataLen;
}

// Find the exact data length that makes the tx hit exactly 1232 bytes
function findPaddingSize() {
    for (let d = 1; d < 2000; d++) {
        if (calcTxSize(d) === MAX_TX_SIZE) return d;
    }
    throw new Error('Could not find padding size — check overhead calculation');
}

const PADDING_SIZE = findPaddingSize(); // Should be 1062

// ─── Random "useless instruction data" ────────────────────────────────────────
function makeInstructionData(dataLen) {
    // First 8 bytes: a recognisable magic header so it looks legit in a hex dump
    const MAGIC = [0xDE, 0xAD, 0xBE, 0xEF, 0xCA, 0xFE, 0xBA, 0xBE];

    // Next 8 bytes: current unix timestamp (little-endian u64) — also useless
    const ts = BigInt(Date.now());
    const tsBytes = [];
    for (let i = 0; i < 8; i++) tsBytes.push(Number((ts >> BigInt(i * 8)) & 0xffn));

    // Remaining bytes: PRNG noise seeded with timestamp so it changes every call
    const noise = new Uint8Array(dataLen - MAGIC.length - tsBytes.length);
    crypto.getRandomValues(noise);

    const out = new Uint8Array(dataLen);
    out.set(MAGIC, 0);
    out.set(tsBytes, 8);
    out.set(noise, 16);
    return out;
}

// ─── Build the serialized transaction ─────────────────────────────────────────
// We hand-serialize to maintain exact size control, then use it for display.
// The actual signing uses @solana/web3.js with a real recent blockhash.
function buildTransaction(feePayer, recentBlockhash) {
    const { Transaction, TransactionInstruction, PublicKey } = solanaWeb3;

    const data = makeInstructionData(PADDING_SIZE);

    const ix = new TransactionInstruction({
        programId: MEMO_PROGRAM_ID,
        keys: [],      // no account metas — all overhead comes from the data
        data,
    });

    const tx = new Transaction({
        feePayer,
        recentBlockhash,
    });
    tx.add(ix);

    return { tx, data };
}

// ─── Wallet state ─────────────────────────────────────────────────────────────
let provider = null;
let wallet   = null;

function getProvider() {
    if (window.phantom?.solana?.isPhantom) return window.phantom.solana;
    if (window.solflare)                   return window.solflare;
    if (window.solana)                     return window.solana;
    return null;
}

async function connectWallet() {
    provider = getProvider();
    if (!provider) { alert('Please install Phantom or another Solana wallet.'); return; }

    try {
        const resp = await provider.connect();
        wallet = resp.publicKey;

        const el = document.getElementById('walletStatus');
        el.className = 'wallet-status connected';
        el.innerHTML = `✓ Wallet Connected<div class="wallet-address">${wallet.toString()}</div>`;

        document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
        document.getElementById('connectBtn').onclick = disconnectWallet;
        document.getElementById('messageSection').classList.add('visible');

        // Pre-compute size so user can see it before clicking Sign
        updateSizeMeter();
    } catch (err) {
        alert('Failed to connect: ' + err.message);
    }
}

async function disconnectWallet() {
    try { if (provider) await provider.disconnect(); } catch {}
    wallet = provider = null;

    document.getElementById('walletStatus').className = 'wallet-status';
    document.getElementById('walletStatus').textContent = 'Wallet not connected';
    document.getElementById('connectBtn').textContent = 'Connect Wallet';
    document.getElementById('connectBtn').onclick = connectWallet;
    document.getElementById('messageSection').classList.remove('visible');
    document.getElementById('result').classList.remove('visible');
    document.getElementById('sizeNum').textContent = '—';
    document.getElementById('sizeNum').className = 'num';
}

function updateSizeMeter() {
    const computed = calcTxSize(PADDING_SIZE);
    const el = document.getElementById('sizeNum');
    el.textContent = computed;
    el.className = 'num' + (computed === MAX_TX_SIZE ? ' exact' : '');
}

// ─── Build & prompt signing straight in Phantom ───────────────────────────────
async function buildAndSign() {
    if (!wallet || !provider) { alert('Connect your wallet first.'); return; }

    const btn = document.getElementById('signBtn');
    btn.disabled = true;
    btn.textContent = 'Building transaction…';

    const r = document.getElementById('result');
    r.classList.remove('visible');

    let recentBlockhash;
    try {
        const conn = new solanaWeb3.Connection('https://api.mainnet-beta.solana.com', 'confirmed');
        const bh   = await conn.getLatestBlockhash();
        recentBlockhash = bh.blockhash;
    } catch {
        // Wallet will still pop up and sign even with a dummy blockhash
        recentBlockhash = 'FakeBlockhashPaddedForSizeCalculation1111111';
    }

    const { tx } = buildTransaction(wallet, recentBlockhash);

    // Confirm exact size before handing to Phantom
    const serialized = tx.serialize({ requireAllSignatures: false, verifySignatures: false });
    const txSize = serialized.length;

    btn.textContent = 'Waiting for Phantom…';

    try {
        // This line pops open Phantom directly — no custom modal in the way
        const signed = await provider.signTransaction(tx);

        const sig    = signed.signatures[0];
        const sigB64 = btoa(String.fromCharCode(...sig.signature));

        r.className = 'result visible';
        r.innerHTML = `
            <strong>✓ Transaction Signed Successfully</strong>
            <b>Serialized TX size:</b> ${txSize} / ${MAX_TX_SIZE} bytes ${txSize === MAX_TX_SIZE ? '✅ exact limit!' : `(Δ ${txSize - MAX_TX_SIZE})`}<br><br>
            <b>Instruction data:</b> ${PADDING_SIZE} bytes of padding<br><br>
            <b>Signature (base64):</b><br>${sigB64}<br><br>
            <b>Signer:</b><br>${wallet.toString()}
        `;
    } catch (err) {
        r.className = 'result visible error';
        r.innerHTML = `<strong>❌ ${err.message}</strong>`;
    }

    btn.disabled = false;
    btn.textContent = 'Build & Sign Max-Size Transaction';
}

// ─── Auto-reconnect ───────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
    provider = getProvider();
    if (!provider) return;
    try {
        const resp = await provider.connect({ onlyIfTrusted: true });
        wallet = resp.publicKey;

        const el = document.getElementById('walletStatus');
        el.className = 'wallet-status connected';
        el.innerHTML = `✓ Wallet Connected<div class="wallet-address">${wallet.toString()}</div>`;

        document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
        document.getElementById('connectBtn').onclick = disconnectWallet;
        document.getElementById('messageSection').classList.add('visible');
        updateSizeMeter();
    } catch { /* silent */ }
});
</script>
</body>
</html>
