<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Memo Transaction</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 { color: #333; margin-bottom: 8px; text-align: center; font-size: 22px; }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .wallet-status {
            padding: 14px 18px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            color: #777;
            text-align: center;
        }

        .wallet-status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .wallet-address {
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            margin-top: 6px;
            color: #388e3c;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 14px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .message-section { display: none; margin-top: 4px; }
        .message-section.visible { display: block; }

        .info-text {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 6px;
            line-height: 1.6;
        }

        .result {
            background: #e8f5e9;
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 18px;
            word-break: break-all;
            font-family: monospace;
            font-size: 11px;
            color: #2e7d32;
            display: none;
        }

        .result.visible { display: block; }
        .result.error { background: #ffebee; color: #c62828; }
        .result.warning { background: #fff3e0; color: #e65100; }
        .result strong { display: block; margin-bottom: 6px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h1>&#x1F4DD; Solana Memo Transaction</h1>
    <p class="subtitle">Simulates & signs a memo transaction with token accounts</p>

    <div id="walletStatus" class="wallet-status">Wallet not connected</div>
    <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>

    <div id="messageSection" class="message-section">
        <button id="signBtn" onclick="buildAndSign()">Simulate & Sign Memo Transaction</button>
        <div class="info-text">
            First simulates the transaction, then prompts for signing.<br>
            Check the browser console for simulation details.
        </div>
    </div>

    <div id="result" class="result"></div>
</div>

<script>
var MEMO_PROGRAM_ID  = new solanaWeb3.PublicKey('MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr');
var TOKEN_PROGRAM_ID = new solanaWeb3.PublicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA');
var MINT_ADDRESS     = new solanaWeb3.PublicKey('642NfDi7su9jQA1M4Jqc67DaLpY1Vqbt7sbvRMZKpump');
var FALLBACK_BLOCKHASH = '11111111111111111111111111111111';

var provider = null;
var wallet   = null;

function getProvider() {
    if (window.phantom && window.phantom.solana && window.phantom.solana.isPhantom)
        return window.phantom.solana;
    if (window.solflare) return window.solflare;
    if (window.solana)   return window.solana;
    return null;
}

async function connectWallet() {
    provider = getProvider();
    if (!provider) { alert('Please install Phantom or another Solana wallet.'); return; }
    try {
        var resp = await provider.connect();
        wallet   = resp.publicKey;
        var el   = document.getElementById('walletStatus');
        el.className = 'wallet-status connected';
        el.innerHTML = '&#10003; Wallet Connected<div class="wallet-address">' + wallet.toString() + '</div>';
        document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
        document.getElementById('connectBtn').onclick = disconnectWallet;
        document.getElementById('messageSection').classList.add('visible');
    } catch (err) {
        alert('Failed to connect: ' + err.message);
    }
}

async function disconnectWallet() {
    try { if (provider) await provider.disconnect(); } catch(e) {}
    wallet = null; provider = null;
    document.getElementById('walletStatus').className = 'wallet-status';
    document.getElementById('walletStatus').textContent = 'Wallet not connected';
    document.getElementById('connectBtn').textContent = 'Connect Wallet';
    document.getElementById('connectBtn').onclick = connectWallet;
    document.getElementById('messageSection').classList.remove('visible');
    document.getElementById('result').classList.remove('visible');
}

// Function to derive ATA address
function getAssociatedTokenAddress(mint, owner) {
    var ASSOCIATED_TOKEN_PROGRAM_ID = new solanaWeb3.PublicKey('ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL');
    
    var seeds = [
        owner.toBuffer(),
        TOKEN_PROGRAM_ID.toBuffer(),
        mint.toBuffer()
    ];
    
    return solanaWeb3.PublicKey.findProgramAddressSync(
        seeds,
        ASSOCIATED_TOKEN_PROGRAM_ID
    )[0];
}

async function buildAndSign() {
    if (!wallet || !provider) { alert('Connect your wallet first.'); return; }

    var btn = document.getElementById('signBtn');
    var r   = document.getElementById('result');
    btn.disabled    = true;
    btn.textContent = 'Fetching blockhash…';
    r.classList.remove('visible');

    var recentBlockhash = null;
    var conn = null;
    
    try {
        conn = new solanaWeb3.Connection(
            'https://mainnet.helius-rpc.com/?api-key=e596e7d1-1e3e-423f-b173-c3264aa44a0a',
            'confirmed'
        );
        recentBlockhash = (await conn.getLatestBlockhash()).blockhash;
        console.log('✓ Fetched recent blockhash:', recentBlockhash);
    } catch(e) {
        recentBlockhash = FALLBACK_BLOCKHASH;
        console.warn('⚠ Failed to fetch blockhash, using fallback:', e.message);
    }

    // Derive the ATA for the user
    var userATA = getAssociatedTokenAddress(MINT_ADDRESS, wallet);
    console.log('\n=== DERIVED ADDRESSES ===');
    console.log('User Wallet:', wallet.toString());
    console.log('Mint Address:', MINT_ADDRESS.toString());
    console.log('User ATA:', userATA.toString());
    console.log('Token Program:', TOKEN_PROGRAM_ID.toString());

    // Build the memo instruction - memo program doesn't use accounts in the instruction
    // but we add them to the transaction to include them in what gets signed
    var memoIx = new solanaWeb3.TransactionInstruction({
        programId: MEMO_PROGRAM_ID,
        keys: [],
        data: new Uint8Array(0),
    });

    // Create a dummy instruction that references the accounts we want in the transaction
    // Using System Program's noop-like behavior by transferring 0 lamports
    var accountRefIx = new solanaWeb3.TransactionInstruction({
        programId: new solanaWeb3.PublicKey('11111111111111111111111111111111'), // System Program
        keys: [
            { pubkey: wallet, isSigner: true, isWritable: true }, // fee payer
            { pubkey: MINT_ADDRESS, isSigner: false, isWritable: false },
            { pubkey: userATA, isSigner: false, isWritable: true },
            { pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false }
        ],
        data: new Uint8Array(0),
    });

    var tx = new solanaWeb3.Transaction({ feePayer: wallet, recentBlockhash: recentBlockhash });
    tx.add(memoIx);
    tx.add(accountRefIx);

    console.log('\n=== TRANSACTION DETAILS ===');
    console.log('Fee Payer:', wallet.toString());
    console.log('Recent Blockhash:', recentBlockhash);
    console.log('Instructions:', tx.instructions.length);
    console.log('\nInstruction 0 (Memo):');
    console.log('  Program ID:', tx.instructions[0].programId.toString());
    console.log('  Keys:', tx.instructions[0].keys.length);
    console.log('  Data:', tx.instructions[0].data);
    console.log('\nInstruction 1 (Account References):');
    console.log('  Program ID:', tx.instructions[1].programId.toString());
    console.log('  Keys:');
    tx.instructions[1].keys.forEach(function(key, idx) {
        console.log('    [' + idx + '] ' + key.pubkey.toString());
        console.log('        isSigner: ' + key.isSigner + ', isWritable: ' + key.isWritable);
    });
    console.log('  Data:', tx.instructions[1].data);

    // Simulate the transaction
    btn.textContent = 'Simulating transaction…';
    
    try {
        if (conn && recentBlockhash !== FALLBACK_BLOCKHASH) {
            console.log('\n=== SIMULATING TRANSACTION ===');
            
            var simulation = await conn.simulateTransaction(tx);
            
            console.log('Simulation Result:', simulation);
            console.log('- Error:', simulation.value.err);
            console.log('- Logs:', simulation.value.logs);
            console.log('- Units Consumed:', simulation.value.unitsConsumed);
            console.log('- Accounts:', simulation.value.accounts);
            
            if (simulation.value.err) {
                console.error('❌ Simulation failed:', simulation.value.err);
                r.className = 'result visible error';
                r.innerHTML = '<strong>❌ Simulation Failed</strong>' +
                    'Error: ' + JSON.stringify(simulation.value.err) + '<br><br>' +
                    'Check console for details.';
                btn.disabled = false;
                btn.textContent = 'Simulate & Sign Memo Transaction';
                return;
            } else {
                console.log('✓ Simulation successful!');
                r.className = 'result visible warning';
                r.innerHTML = '<strong>✓ Simulation Successful</strong>' +
                    'Units consumed: ' + (simulation.value.unitsConsumed || 'N/A') + '<br>' +
                    'ATA: ' + userATA.toString() + '<br>' +
                    'Proceeding to wallet signature…';
            }
        } else {
            console.warn('⚠ Skipping simulation (using fallback blockhash)');
        }
    } catch(simErr) {
        console.error('❌ Simulation error:', simErr);
        r.className = 'result visible error';
        r.innerHTML = '<strong>❌ Simulation Error</strong>' +
            simErr.message + '<br><br>Check console for details.';
        btn.disabled = false;
        btn.textContent = 'Simulate & Sign Memo Transaction';
        return;
    }

    // Now prompt for signature
    btn.textContent = 'Waiting for wallet signature…';

    try {
        console.log('\n=== REQUESTING SIGNATURE ===');
        var signed = await provider.signTransaction(tx);
        var sig    = signed.signatures[0];
        var sigB64 = btoa(String.fromCharCode.apply(null, sig.signature));

        console.log('✓ Transaction signed successfully');
        console.log('Signature (base64):', sigB64);
        console.log('Signer:', wallet.toString());
        console.log('Full signed transaction:', signed);

        r.className = 'result visible';
        r.innerHTML =
            '<strong>&#10003; Transaction Signed</strong>' +
            '<b>Signature (base64):</b><br>' + sigB64 + '<br><br>' +
            '<b>Signer:</b><br>' + wallet.toString() + '<br><br>' +
            '<b>User ATA:</b><br>' + userATA.toString();
    } catch(err) {
        console.error('❌ Signing error:', err);
        r.className = 'result visible error';
        r.innerHTML = '<strong>&#x274C; ' + err.message + '</strong>';
    }

    btn.disabled    = false;
    btn.textContent = 'Simulate & Sign Memo Transaction';
}

window.addEventListener('load', async function() {
    provider = getProvider();
    if (!provider) return;
    try {
        var resp = await provider.connect({ onlyIfTrusted: true });
        wallet   = resp.publicKey;
        var el   = document.getElementById('walletStatus');
        el.className = 'wallet-status connected';
        el.innerHTML = '&#10003; Wallet Connected<div class="wallet-address">' + wallet.toString() + '</div>';
        document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
        document.getElementById('connectBtn').onclick = disconnectWallet;
        document.getElementById('messageSection').classList.add('visible');
    } catch(e) { /* silent */ }
});
</script>
</body>
</html>
