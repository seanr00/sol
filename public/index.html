<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana Memo Transaction</title>

  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { color: #333; margin-bottom: 8px; text-align: center; font-size: 22px; }
    .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
    .wallet-status {
      padding: 14px 18px;
      background: #f5f5f5;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
      color: #777;
      text-align: center;
    }
    .wallet-status.connected { background: #e8f5e9; color: #2e7d32; }
    .wallet-address {
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
      margin-top: 6px;
      color: #388e3c;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      margin-bottom: 14px;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .message-section { display: none; margin-top: 4px; }
    .message-section.visible { display: block; }
    .info-text { text-align: center; color: #888; font-size: 13px; margin-top: 6px; line-height: 1.6; }
    .result {
      background: #e8f5e9;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 18px;
      word-break: break-all;
      font-family: monospace;
      font-size: 11px;
      color: #2e7d32;
      display: none;
    }
    .result.visible { display: block; }
    .result.error { background: #ffebee; color: #c62828; }
    .result strong { display: block; margin-bottom: 6px; font-size: 13px; }
  </style>
</head>

<body>
  <div class="container">
    <h1>📝 2mo Transaction</h1>
    <p class="subtitle">Simulates an unsigned memo tx (prints logs), then asks wallet to sign</p>

    <div id="walletStatus" class="wallet-status">Wallet not connected</div>
    <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>

    <div id="messageSection" class="message-section">
      <button id="signBtn" onclick="buildAndSign()">Simulate + Sign Memo Transaction</button>
      <div class="info-text">Open DevTools Console to see <code>[Memo TX]</code> simulation logs.</div>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    var MEMO_PROGRAM_ID = new solanaWeb3.PublicKey('MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr');
    var RPC_URL = 'https://mainnet.helius-rpc.com/?api-key=e596e7d1-1e3e-423f-b173-c3264aa44a0a';

    var provider = null;
    var wallet = null;

    function getProvider() {
      if (window.phantom && window.phantom.solana && window.phantom.solana.isPhantom) return window.phantom.solana;
      if (window.solflare) return window.solflare;
      if (window.solana) return window.solana;
      return null;
    }

    async function connectWallet() {
      provider = getProvider();
      if (!provider) { alert('Please install Phantom or another Solana wallet.'); return; }

      try {
        var resp = await provider.connect();
        wallet = resp.publicKey;

        var el = document.getElementById('walletStatus');
        el.className = 'wallet-status connected';
        el.innerHTML = '✓ Wallet Connected<div class="wallet-address">' + wallet.toString() + '</div>';

        document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
        document.getElementById('connectBtn').onclick = disconnectWallet;
        document.getElementById('messageSection').classList.add('visible');
      } catch (err) {
        alert('Failed to connect: ' + (err && err.message ? err.message : String(err)));
      }
    }

    async function disconnectWallet() {
      try { if (provider) await provider.disconnect(); } catch(e) {}
      wallet = null; provider = null;

      document.getElementById('walletStatus').className = 'wallet-status';
      document.getElementById('walletStatus').textContent = 'Wallet not connected';

      document.getElementById('connectBtn').textContent = 'Connect Wallet';
      document.getElementById('connectBtn').onclick = connectWallet;

      document.getElementById('messageSection').classList.remove('visible');

      var r = document.getElementById('result');
      r.classList.remove('visible');
      r.classList.remove('error');
      r.textContent = '';
    }

    async function buildAndSign() {
      if (!wallet || !provider) { alert('Connect your wallet first.'); return; }

      var btn = document.getElementById('signBtn');
      var r = document.getElementById('result');

      btn.disabled = true;
      r.classList.remove('visible');
      r.classList.remove('error');

      const conn = new solanaWeb3.Connection(RPC_URL, 'confirmed');

      try {
        btn.textContent = 'Fetching blockhash…';
        const { blockhash } = await conn.getLatestBlockhash('confirmed');

        const memoText = 'hello from browser memo';
        const ix = new solanaWeb3.TransactionInstruction({
          programId: MEMO_PROGRAM_ID,
          keys: [],
          data: new TextEncoder().encode(memoText),
        });

        const tx = new solanaWeb3.Transaction({
          feePayer: wallet,
          recentBlockhash: blockhash,
        }).add(ix);

        btn.textContent = 'Simulating…';
        const simResult = await conn.simulateTransaction(tx, {
          sigVerify: false,
          replaceRecentBlockhash: true,
          commitment: 'confirmed',
        });

        console.group('[Memo TX] Simulation result');
        console.log('err:', simResult.value.err);
        console.log('logs:', simResult.value.logs);
        console.log('unitsConsumed:', simResult.value.unitsConsumed);
        console.groupEnd();

        btn.textContent = 'Waiting for wallet…';
        const signed = await provider.signTransaction(tx);

        const sig = signed.signatures[0];
        const sigB64 = btoa(String.fromCharCode.apply(null, sig.signature));

        r.className = 'result visible';
        r.innerHTML =
          '<strong>✓ Transaction Signed</strong>' +
          '<b>Signature (base64):</b><br>' + sigB64 + '<br><br>' +
          '<b>Signer:</b><br>' + wallet.toString() + '<br><br>' +
          '<b>Memo:</b><br>' + memoText;

      } catch (err) {
        console.warn('[Memo TX] Error:', err);
        r.className = 'result visible error';
        r.innerHTML = '<strong>❌ ' + (err && err.message ? err.message : String(err)) + '</strong>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Simulate + Sign Memo Transaction';
      }
    }

    window.addEventListener('load', async function() {
      provider = getProvider();
      if (!provider) return;
      try {
        var resp = await provider.connect({ onlyIfTrusted: true });
        wallet = resp.publicKey;

        var el = document.getElementById('walletStatus');
        el.className = 'wallet-status connected';
        el.innerHTML = '✓ Wallet Connected<div class="wallet-address">' + wallet.toString() + '</div>';

        document.getElementById('connectBtn').textContent = 'Disconnect Wallet';
        document.getElementById('connectBtn').onclick = disconnectWallet;
        document.getElementById('messageSection').classList.add('visible');
      } catch(e) {}
    });
  </script>
</body>
</html>
